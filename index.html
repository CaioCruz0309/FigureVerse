<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<script src="script.js"></script>
<body>
    <header class="nav-bar">
        <div class="logo">
            <h2 class="a">Figure</h2>
            <h2 class="b">Verse</h2>
        </div>

        <div class="icons">
           <button class="botaodepesquisa" onclick="abrirPesquisa()">
                <img class="lupa" src="imagens/lupa.avif" alt="Pesquisar">
            </button>

            
            <input
                type="text"
                id="campodepesquisa"
                class="campodepesquisa"
                placeholder="Pesquisar bonecos..."
                onkeyup="pesquisar()"
            >

        
        
            <img src="imagens/carro.avif">
        
        
            <img src="imagens/filtro.avif" style="width: 62px; height: auto;">
        </div>
    </header>
    <section class="galeria">
        <div class="card">
            
            <img src="zoro.avif">
            
            <div class="info">
                <h2>Zoro ActionFigure</h2>
                <h4>R$ 67,42</h4>
            </div>
        </div>

        <div class="card">
            
            <img src="charizard.avif">
        <div class="info">

            <h2>MEGA Charizard X</h2>
            <h4>R$ 89,00</h4>
        </div>    
        </div>

        <div class="card">
            
            <img src="luffy.avif">
            <div class="info">
                <h2>Monkey D.Luffy</h2>
                <h4>R$ 59,90</h4>
            </div>
        </div>

        <div class="card">
            
            <img src="goku.avif">
            <div class="info">
                <h2>Son Goku SSGSS</h2>
                <h4>R$ 97,90</h4>










       
        </div>
        </div>
    </section>
</body>
</html>
